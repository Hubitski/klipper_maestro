# Klipper configuration for Maestro Grand 2 IDEX
# 400x400x400 mm build volume, Independent Dual Extruders (IDEX),
# Multi-drop MCU bus via Host Multiplexer and Motherboard Gateway Router.

# ====================================================================
# Microcontroller Definitions
# ====================================================================

# 1. Main Motherboard (ATmega1284p): Kinematics, X/X1/Y/Z Steppers, Endstops
[mcu]
serial: /tmp/klipper_mcu_main
restart_method: command

# 2. Toolhead 0 (ATmega16A, Left Carriage): Extruder 0, Hotend 0, Part Fan 0, Z-Probe
[mcu head0]
serial: /tmp/klipper_mcu_head0
restart_method: command

# 3. Toolhead 1 (ATmega16A, Right Carriage): Extruder 1, Hotend 1, Part Fan 1
[mcu head1]
serial: /tmp/klipper_mcu_head1
restart_method: command

# 4. Heated Bed (ATmega16A): Bed Heater, Bed Thermistor
[mcu bed]
serial: /tmp/klipper_mcu_bed
restart_method: command

# ====================================================================
# Printer Kinematics & Dimensions (400x400x400)
# ====================================================================

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

# Motherboard pinout verified against the stock Maestro printer.cfg that
# shipped on this printer (single ATmega1284p board on /dev/ttyS1).
[duplicate_pin_override]
pins: PD4

# ====================================================================
# X Axis (Primary Carriage - Toolhead 0)
# ====================================================================

[stepper_x]
step_pin: PB2
dir_pin: !PB1
enable_pin: !PD5
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 0
position_min: -10
position_max: 300
homing_speed: 50
homing_retract_dist: 0

[tmc2130 stepper_x]
cs_pin: PB0
spi_bus: spi
run_current: 0.700
stealthchop_threshold: 999999
diag1_pin: ^!PD4

# ====================================================================
# Dual Carriage Axis (Secondary Carriage - Toolhead 1, IDEX)
# ====================================================================

[dual_carriage]
axis: x
step_pin: PA2
dir_pin: !PA1
enable_pin: !PD5
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2130_dual_carriage:virtual_endstop
position_endstop: 340
position_min: -10
position_max: 340
homing_speed: 50
homing_retract_dist: 0

[tmc2130 dual_carriage]
cs_pin: PA3
spi_bus: spi
run_current: 0.700
stealthchop_threshold: 999999
diag1_pin: ^!PD4

# ====================================================================
# Y Axis
# ====================================================================

[stepper_y]
step_pin: PC1
dir_pin: PC6
enable_pin: !PD5
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_endstop: 0
position_min: -10
position_max: 300
homing_speed: 50
homing_retract_dist: 0

[tmc2130 stepper_y]
cs_pin: PD6
spi_bus: spi
run_current: 0.800
stealthchop_threshold: 999999
diag1_pin: ^!PD4

# ====================================================================
# Z Axis
# ====================================================================

[stepper_z]
step_pin: PB4
dir_pin: PA4
enable_pin: !PD5
microsteps: 16
rotation_distance: 4
# The machine has a physical Z endstop on the motherboard (PC7), as used by
# the stock config.  Load-cell probing is pending - see the [load_cell_probe]
# note above; the firmware cannot yet deliver the trigger in time.
endstop_pin: ^!PC7
position_endstop: 0
position_min: -3.0
position_max: 400
homing_speed: 5.0

[tmc2130 stepper_z]
cs_pin: PA0
spi_bus: spi
run_current: 0.700
stealthchop_threshold: 999999

# ====================================================================
# Toolhead 0 (Left Carriage: Extruder, Heater, Fan, Probe)
# ====================================================================

# Pins verified with a working Arduino test sketch on the real toolhead:
#   STEP=PA7, DIR=PC6, ENN=PC7, TMC2130 CS=PA0, SPI SCK=PB7/MOSI=PB5/MISO=PB6
#   Heater=PD7, thermistor=PA4, fans=PD4+PD5, HX711 DOUT=PD3 / SCK=PD6.
[extruder]
step_pin: head0:PA7
dir_pin: !head0:PC6
enable_pin: !head0:PC7
microsteps: 16
rotation_distance: 7.71
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: head0:PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: head0:PA4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300

[fan_generic part_fan_0]
pin: head0:PD4

[heater_fan hotend_fan_0]
# PD6 is the HX711 clock on this board - the hotend fan is PD5.
pin: head0:PD5
heater: extruder
heater_temp: 50.0

# TMC2130 of the extruder lives on the toolhead itself; the firmware is
# built with CONFIG_WANT_SPI and uses the AVR hardware SPI block.
[tmc2130 extruder]
cs_pin: head0:PA0
spi_bus: spi
run_current: 0.800
stealthchop_threshold: 999999

# ====================================================================
# Toolhead 1 (Right Carriage: Extruder, Heater, Fan)
# ====================================================================

[extruder1]
step_pin: head1:PA7
dir_pin: !head1:PC6
enable_pin: !head1:PC7
microsteps: 16
rotation_distance: 7.71
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: head1:PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: head1:PA4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300

[fan_generic part_fan_1]
pin: head1:PD4

[heater_fan hotend_fan_1]
pin: head1:PD5
heater: extruder1
heater_temp: 50.0

[tmc2130 extruder1]
cs_pin: head1:PA0
spi_bus: spi
run_current: 0.800
stealthchop_threshold: 999999

# ====================================================================
# Heated Bed (Bed MCU)
# ====================================================================

[heater_bed]
heater_pin: bed:PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: bed:PA0
control: pid
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 940
min_temp: 0
max_temp: 130

# ====================================================================
# Z-Probe (Strain Gauge on Toolhead 0)
# ====================================================================

# Z-probe: HX711 load cell on the toolhead (DOUT=PD3, PD_SCK=PD6).
#
# NOTE: with the current strict-polled bus the trigger event cannot reach
# the host (and from there the motherboard's Z stepper) within the 25 ms
# multi-MCU trsync timeout - asynchronous MCU messages wait for the next
# incoming command.  Keep this section disabled until the trigger path is
# solved (dedicated trigger wire or an urgent-transmit firmware change).
# Calibration values come from LOAD_CELL_CALIBRATE.
#[load_cell_probe]
#sensor_type: hx711
#dout_pin: head0:PD3
#sclk_pin: head0:PD6
#sample_rate: 80
#gain: A-128
#counts_per_gram: 1000
#reference_tare_counts: 0
#trigger_force: 75.0

# ====================================================================
# Safe Homing Override for IDEX
# Ensures Toolhead 0 is centered over the bed before probing Z!
# (Prevents probing in empty space at parking position X=-45)
# ====================================================================

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_y = home_all or 'Y' in params %}
    {% set home_z = home_all or 'Z' in params %}

    # Ensure X and Y are homed before Z probe can move to bed center
    {% if home_z and not home_x and "x" not in printer.toolhead.homed_axes %}
        {% set home_x = True %}
    {% endif %}
    {% if home_z and not home_y and "y" not in printer.toolhead.homed_axes %}
        {% set home_y = True %}
    {% endif %}

    {% if home_x %}
        # Home both IDEX carriages
        G28 X
    {% endif %}
    {% if home_y %}
        G28 Y
    {% endif %}
    {% if home_z %}
        # Ensure Toolhead 0 is active and centered over bed
        SET_DUAL_CARRIAGE CARRIAGE=0
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        G90
        G1 X200 Y200 F6000
        # Probe Z at bed center
        G28 Z
        # Lift Z after homing
        G1 Z10 F1200
    {% endif %}

[bed_mesh]
speed: 80
horizontal_move_z: 3
mesh_min: 20, 20
mesh_max: 380, 380
probe_count: 5, 5

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Perform bed mesh calibration using Toolhead 0 probe
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    T0
    _BED_MESH_CALIBRATE_BASE {rawparams}

# ====================================================================
# Part Cooling Fan Dynamic Routing (M106 / M107)
# ====================================================================

[gcode_macro M106]
description: Redirect M106 fan speed to active toolhead part fan (supports P parameter)
gcode:
    {% set speed = params.S|default(255)|float / 255.0 %}
    {% if params.P is defined %}
        {% if params.P|int == 1 %}
            SET_FAN_SPEED FAN=part_fan_1 SPEED={speed}
        {% else %}
            SET_FAN_SPEED FAN=part_fan_0 SPEED={speed}
        {% endif %}
    {% else %}
        {% if printer.toolhead.extruder == "extruder1" %}
            SET_FAN_SPEED FAN=part_fan_1 SPEED={speed}
        {% else %}
            SET_FAN_SPEED FAN=part_fan_0 SPEED={speed}
        {% endif %}
    {% endif %}

[gcode_macro M107]
description: Turn off part cooling fans (supports P parameter)
gcode:
    {% if params.P is defined %}
        {% if params.P|int == 1 %}
            SET_FAN_SPEED FAN=part_fan_1 SPEED=0
        {% else %}
            SET_FAN_SPEED FAN=part_fan_0 SPEED=0
        {% endif %}
    {% else %}
        SET_FAN_SPEED FAN=part_fan_0 SPEED=0
        SET_FAN_SPEED FAN=part_fan_1 SPEED=0
    {% endif %}

# ====================================================================
# IDEX Tool Change Macros
# ====================================================================

[gcode_macro T0]
gcode:
    {% if printer.toolhead.extruder != "extruder" %}
        SET_DUAL_CARRIAGE CARRIAGE=1
        PARK_TOOLHEAD1
        SET_DUAL_CARRIAGE CARRIAGE=0
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}

[gcode_macro T1]
gcode:
    {% if printer.toolhead.extruder != "extruder1" %}
        SET_DUAL_CARRIAGE CARRIAGE=0
        PARK_TOOLHEAD0
        SET_DUAL_CARRIAGE CARRIAGE=1
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        # Adjust T1 toolhead offsets relative to T0 here:
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}

[gcode_macro PARK_TOOLHEAD0]
gcode:
    SAVE_GCODE_STATE NAME=park0
    G90
    G1 X-45 F6000
    RESTORE_GCODE_STATE NAME=park0

[gcode_macro PARK_TOOLHEAD1]
gcode:
    SAVE_GCODE_STATE NAME=park1
    G90
    G1 X445 F6000
    RESTORE_GCODE_STATE NAME=park1
