# Klipper configuration for Maestro Grand 2 IDEX
# 400x400x400 mm build volume, Independent Dual Extruders (IDEX),
# Multi-drop MCU bus via Host Multiplexer and Motherboard Gateway Router.

# ====================================================================
# Microcontroller Definitions
# ====================================================================

# 1. Main Motherboard (ATmega1284p): Kinematics, X/X1/Y/Z Steppers, Endstops
[mcu]
serial: /tmp/klipper_mcu_main
restart_method: command

# 2. Toolhead 0 (ATmega16A, Left Carriage): Extruder 0, Hotend 0, Part Fan 0, Z-Probe
[mcu head0]
serial: /tmp/klipper_mcu_head0
restart_method: command

# 3. Toolhead 1 (ATmega16A, Right Carriage): Extruder 1, Hotend 1, Part Fan 1
[mcu head1]
serial: /tmp/klipper_mcu_head1
restart_method: command

# 4. Heated Bed (ATmega16A): Bed Heater, Bed Thermistor
[mcu bed]
serial: /tmp/klipper_mcu_bed
restart_method: command

# ====================================================================
# Printer Kinematics & Dimensions (400x400x400)
# ====================================================================

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

# ====================================================================
# X Axis (Primary Carriage - Toolhead 0)
# ====================================================================

[stepper_x]
step_pin: PD7
dir_pin: !PD6
enable_pin: !PD5
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: -45
position_min: -45
position_max: 400
homing_speed: 40
homing_retract_dist: 0

[tmc2130 stepper_x]
cs_pin: PB0
spi_software_miso_pin: PB6
spi_software_mosi_pin: PB5
spi_software_sclk_pin: PB7
run_current: 0.800
diag1_pin: ^!PC7
driver_SGT: 2

# ====================================================================
# Dual Carriage Axis (Secondary Carriage - Toolhead 1, IDEX)
# ====================================================================

[dual_carriage]
axis: x
step_pin: PC6
dir_pin: PC5
enable_pin: !PC4
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2130_dual_carriage:virtual_endstop
position_endstop: 445
position_min: 0
position_max: 445
homing_speed: 40
homing_retract_dist: 0

[tmc2130 dual_carriage]
cs_pin: PB1
spi_software_miso_pin: PB6
spi_software_mosi_pin: PB5
spi_software_sclk_pin: PB7
run_current: 0.800
diag1_pin: ^!PC3
driver_SGT: 2

# ====================================================================
# Y Axis
# ====================================================================

[stepper_y]
step_pin: PC2
dir_pin: !PC1
enable_pin: !PC0
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 400
homing_speed: 40
homing_retract_dist: 0

[tmc2130 stepper_y]
cs_pin: PB2
spi_software_miso_pin: PB6
spi_software_mosi_pin: PB5
spi_software_sclk_pin: PB7
run_current: 0.900
diag1_pin: ^!PA4
driver_SGT: 2

# ====================================================================
# Z Axis
# ====================================================================

[stepper_z]
step_pin: PA7
dir_pin: PA6
enable_pin: !PA5
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: -3.0
position_max: 400
# Safe homing speed for multi-MCU strain gauge probe latency (~15ms response round-trip)
homing_speed: 2.0

[tmc2130 stepper_z]
cs_pin: PB3
spi_software_miso_pin: PB6
spi_software_mosi_pin: PB5
spi_software_sclk_pin: PB7
run_current: 0.800

# ====================================================================
# Toolhead 0 (Left Carriage: Extruder, Heater, Fan, Probe)
# ====================================================================

[extruder]
step_pin: head0:PB0
dir_pin: head0:PB1
enable_pin: !head0:PB2
microsteps: 16
rotation_distance: 7.71
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: head0:PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: head0:PA0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300

[fan_generic part_fan_0]
pin: head0:PD4

[heater_fan hotend_fan_0]
pin: head0:PD6
heater: extruder
heater_temp: 50.0

# ====================================================================
# Toolhead 1 (Right Carriage: Extruder, Heater, Fan)
# ====================================================================

[extruder1]
step_pin: head1:PB0
dir_pin: !head1:PB1
enable_pin: !head1:PB2
microsteps: 16
rotation_distance: 7.71
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: head1:PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: head1:PA0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300

[fan_generic part_fan_1]
pin: head1:PD4

[heater_fan hotend_fan_1]
pin: head1:PD6
heater: extruder1
heater_temp: 50.0

# ====================================================================
# Heated Bed (Bed MCU)
# ====================================================================

[heater_bed]
heater_pin: bed:PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: bed:PA0
control: pid
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 940
min_temp: 0
max_temp: 130

# ====================================================================
# Z-Probe (Strain Gauge on Toolhead 0)
# ====================================================================

[probe]
pin: ^head0:PD2
x_offset: 0.0
y_offset: 0.0
z_offset: 0.0
speed: 2.0
lift_speed: 5.0
samples: 2
samples_result: median
sample_retract_dist: 2.0

# ====================================================================
# Safe Homing Override for IDEX
# Ensures Toolhead 0 is centered over the bed before probing Z!
# (Prevents probing in empty space at parking position X=-45)
# ====================================================================

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_y = home_all or 'Y' in params %}
    {% set home_z = home_all or 'Z' in params %}

    # Ensure X and Y are homed before Z probe can move to bed center
    {% if home_z and not home_x and "x" not in printer.toolhead.homed_axes %}
        {% set home_x = True %}
    {% endif %}
    {% if home_z and not home_y and "y" not in printer.toolhead.homed_axes %}
        {% set home_y = True %}
    {% endif %}

    {% if home_x %}
        # Home both IDEX carriages
        G28 X
    {% endif %}
    {% if home_y %}
        G28 Y
    {% endif %}
    {% if home_z %}
        # Ensure Toolhead 0 is active and centered over bed
        SET_DUAL_CARRIAGE CARRIAGE=0
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        G90
        G1 X200 Y200 F6000
        # Probe Z at bed center
        G28 Z
        # Lift Z after homing
        G1 Z10 F1200
    {% endif %}

[bed_mesh]
speed: 80
horizontal_move_z: 3
mesh_min: 20, 20
mesh_max: 380, 380
probe_count: 5, 5

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Perform bed mesh calibration using Toolhead 0 probe
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    T0
    _BED_MESH_CALIBRATE_BASE {rawparams}

# ====================================================================
# Part Cooling Fan Dynamic Routing (M106 / M107)
# ====================================================================

[gcode_macro M106]
description: Redirect M106 fan speed to active toolhead part fan (supports P parameter)
gcode:
    {% set speed = params.S|default(255)|float / 255.0 %}
    {% if params.P is defined %}
        {% if params.P|int == 1 %}
            SET_FAN_SPEED FAN=part_fan_1 SPEED={speed}
        {% else %}
            SET_FAN_SPEED FAN=part_fan_0 SPEED={speed}
        {% endif %}
    {% else %}
        {% if printer.toolhead.extruder == "extruder1" %}
            SET_FAN_SPEED FAN=part_fan_1 SPEED={speed}
        {% else %}
            SET_FAN_SPEED FAN=part_fan_0 SPEED={speed}
        {% endif %}
    {% endif %}

[gcode_macro M107]
description: Turn off part cooling fans (supports P parameter)
gcode:
    {% if params.P is defined %}
        {% if params.P|int == 1 %}
            SET_FAN_SPEED FAN=part_fan_1 SPEED=0
        {% else %}
            SET_FAN_SPEED FAN=part_fan_0 SPEED=0
        {% endif %}
    {% else %}
        SET_FAN_SPEED FAN=part_fan_0 SPEED=0
        SET_FAN_SPEED FAN=part_fan_1 SPEED=0
    {% endif %}

# ====================================================================
# IDEX Tool Change Macros
# ====================================================================

[gcode_macro T0]
gcode:
    {% if printer.toolhead.extruder != "extruder" %}
        SET_DUAL_CARRIAGE CARRIAGE=1
        PARK_TOOLHEAD1
        SET_DUAL_CARRIAGE CARRIAGE=0
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}

[gcode_macro T1]
gcode:
    {% if printer.toolhead.extruder != "extruder1" %}
        SET_DUAL_CARRIAGE CARRIAGE=0
        PARK_TOOLHEAD0
        SET_DUAL_CARRIAGE CARRIAGE=1
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        # Adjust T1 toolhead offsets relative to T0 here:
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}

[gcode_macro PARK_TOOLHEAD0]
gcode:
    SAVE_GCODE_STATE NAME=park0
    G90
    G1 X-45 F6000
    RESTORE_GCODE_STATE NAME=park0

[gcode_macro PARK_TOOLHEAD1]
gcode:
    SAVE_GCODE_STATE NAME=park1
    G90
    G1 X445 F6000
    RESTORE_GCODE_STATE NAME=park1
