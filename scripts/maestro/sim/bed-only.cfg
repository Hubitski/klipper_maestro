# Minimal bed-only config for the query-clock regression test.
[mcu]
serial: /tmp/klipper_host_mcu
[mcu bed]
serial: /tmp/klipper_mcu_bed
restart_method: command
[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
[thermistor bed_ntc]
temperature1: 25
resistance1: 40000
beta: 3950
[multi_pin bed_heaters]
pins: bed:PD5,bed:PD4,bed:PD6,bed:PD7
[heater_bed]
heater_pin: multi_pin:bed_heaters
sensor_type: bed_ntc
sensor_pin: bed:PA4
pullup_resistor: 10000
sample_count: 1
report_time: 0.5
control: pid
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 940.0
max_power: 1.0
min_temp: 0
max_temp: 120
