# Klipper config for the Maestro simulator.
#
# Mirrors the real printer.cfg for the three peripheral boards.  The main
# ATmega1284p board is not simulated (steppers/TMC/sensorless are not the
# goal), so the Linux host MCU is the primary MCU and kinematics is "none".
# The extruder steppers live on the toolheads anyway, so extruder PID,
# heaters, fans, the bed and the load cell are all real paths.
#
# Serial paths:
#   /tmp/klipper_host_mcu  - Linux MCU started by run_sim.sh
#   /tmp/klipper_mcu_*     - PTYs created by host_multiplexer.py
#   /tmp/sim_bus_upstream  - hub half of the peripheral bus

[mcu]
serial: /tmp/klipper_host_mcu

[mcu head0]
serial: /tmp/klipper_mcu_head0
restart_method: command

[mcu head1]
serial: /tmp/klipper_mcu_head1
restart_method: command

[mcu bed]
serial: /tmp/klipper_mcu_bed
restart_method: command

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[force_move]
enable_force_move: True

# ---------------------------------------------------------------- head 0
[extruder]
step_pin: head0:PA7
dir_pin: !head0:PC6
enable_pin: !head0:PC7
microsteps: 16
gear_ratio: 25:1
rotation_distance: 32.6726
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: head0:PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: head0:PA4
pullup_resistor: 4700
sample_count: 4
report_time: 0.5
max_power: 0.5
max_extrude_only_distance: 200
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[fan_generic part_fan_0]
pin: head0:PD5

[heater_fan hotend_fan_0]
pin: head0:PD4
heater: extruder
heater_temp: 50.0

# ---------------------------------------------------------------- head 1
[extruder1]
step_pin: head1:PA7
dir_pin: !head1:PC6
enable_pin: !head1:PC7
microsteps: 16
rotation_distance: 7.71
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: head1:PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: head1:PA4
pullup_resistor: 4700
sample_count: 4
report_time: 0.5
max_power: 0.5
max_extrude_only_distance: 200
control: pid
pid_Kp: 4.405
pid_Ki: 0.133
pid_Kd: 36.507
min_temp: 0
max_temp: 250

[fan_generic part_fan_1]
pin: head1:PD5

[heater_fan hotend_fan_1]
pin: head1:PD4
heater: extruder1
heater_temp: 50.0

# ---------------------------------------------------------------- bed
[thermistor bed_ntc]
temperature1: 25
resistance1: 40000
beta: 3950

[multi_pin bed_heaters]
pins: bed:PD5,bed:PD4,bed:PD6,bed:PD7

[temperature_sensor bed_ts1]
sensor_type: bed_ntc
sensor_pin: bed:PA4
pullup_resistor: 10000
sample_count: 1
report_time: 0.5

[heater_bed]
heater_pin: multi_pin:bed_heaters
sensor_type: temperature_combined
sensor_list: temperature_sensor bed_ts1
combination_method: mean
maximum_deviation: 5.0
control: pid
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 940.0
max_power: 1.0
min_temp: 0
max_temp: 120

# ---------------------------------------------------------------- load cell
[load_cell_probe]
sensor_type: hx711
dout_pin: head0:PD3
sclk_pin: head0:PD6
sample_rate: 80
gain: A-128
z_offset: 0.0
counts_per_gram: 1000.0
reference_tare_counts: 0
trigger_force: 75.0
force_safety_limit: 2000
speed: 2.0
lift_speed: 5.0
samples: 1
